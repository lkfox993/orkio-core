# A Docker Compose must always start with the version tag.
# We use '3' because it's the last version.
version: "3"

services:

  orkio:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      TIKV_PD_ADDR: ork-tikv-pd:2379
    depends_on:
      - ork-tikv-pd
      - ork-tikv
      - ork-postgres
    restart: unless-stopped
    ports:
      - "8080:8080"

  ork-postgres:
    # Official Postgres image from DockerHub (we use the last version)
    image: "postgres:latest"
    container_name: ork-postgres
    ports:
      - 5439:5432
    environment:
      POSTGRES_USER: orkio # The PostgreSQL user (useful to connect to the database)
      POSTGRES_PASSWORD: password # The PostgreSQL password (useful to connect to the database)
      POSTGRES_DB: orkio # The PostgreSQL default database (automatically created at first launch)

  ork-pulsar:
    image: apachepulsar/pulsar:3.3.0
    command: bin/pulsar standalone
    ports:
      # Binary protocol port for client connections
      - "6650:6650"
      # HTTP port for admin API and REST endpoints
      - "8089:8080"
    # volumes:
    #   # Persist topic data and metadata
    #   - pulsar_data:/pulsar/data
    #   # Persist configuration
    #   - pulsar_conf:/pulsar/conf
    # environment:
    #   # Set JVM memory limits to prevent container OOM
    #   PULSAR_MEM: "-Xms256m -Xmx512m"
    # healthcheck:
    #   test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 30s
    # restart: unless-stopped

  ork-pulsar-ui:
    image: apachepulsar/pulsar-manager:v0.2.0
    ports:
      # Web UI port
      - "9527:9527"
      # Backend API port
      - "7750:7750"
    environment:
      SPRING_CONFIGURATION_FILE: /pulsar-manager/pulsar-manager/application.properties
    depends_on:
      ork-pulsar:
        condition: service_healthy

  ork-tidb:
    image: pingcap/tidb:latest
    container_name: ork-tidb
    restart: unless-stopped
    depends_on:
      - ork-tikv-pd
      - ork-tikv
    ports:
      - "4000:4000"
      - "10080:10080"
    command:
      - --store=tikv
      - --path=ork-tikv-pd:2379
      - --host=0.0.0.0
      - --advertise-address=ork-tidb

  ork-tikv-pd:
    image: pingcap/pd:latest
    container_name: ork-tikv-pd
    ports:
      - "2379:2379"
      - "2380:2380"
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://ork-tikv-pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://ork-tikv-pd:2380
      - --initial-cluster=pd=http://ork-tikv-pd:2380
    volumes:
      - pd_data:/data/pd
      
  ork-tikv:
    image: pingcap/tikv:latest
    container_name: ork-tikv
    depends_on:
      - ork-tikv-pd
    ports:
      - "20160:20160"
      # - "20180:20180"
    command:
      - --addr=0.0.0.0:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=ork-tikv:20180
      - --advertise-addr=ork-tikv:20160
      - --pd-endpoints=ork-tikv-pd:2379
      - --data-dir=/data/tikv
      - --log-file=
    volumes:
      - tikv_data:/data/tikv
  
  ork-tikv-ui:
    image: ghcr.io/getstream/tikv-ui:latest
    container_name: ork-tikv-ui
    environment:
      # **IMPORTANT:** Set TIKV_PD_ADDRS to the addresses of your PD nodes
      TIKV_PD_ADDRS: "ork-tikv-pd:2379"
      TIKV_UI_METRICS_SCRAPE_INTERVAL: "30s"
    # Use depends_on to ensure PD nodes are up before the UI starts
    depends_on:
      - "ork-tikv-pd"
    ports:
      - "8081:8081"

volumes:
  pd_data:
  tikv_data:
  pulsar_data:
  go_mod_cache:
  go_build_cache:
  

  